# Performance testing overlay. scripts/load.sh sets COMPOSE_FILE to use it together with
# docker-compose.yml. It is not part of the normal stack.
services:
  postgres:
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=all
      - -c
      - track_io_timing=on
      - -c
      - synchronous_commit=${PG_SYNCHRONOUS_COMMIT:-on}

  service:
    environment:
      DB_POOL_MAX: ${DB_POOL_MAX:-10}
      ACCOUNT_CONCURRENCY: ${ACCOUNT_CONCURRENCY:-2}

  k6:
    image: grafana/k6:1.0.0
    profiles: ["load"]
    # Run as your own user so result files are not owned by root.
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    environment:
      BASE_URL: http://service:3000
      ADMIN_TOKEN: ${ADMIN_TOKEN:-dev-admin-token-change-me}
    volumes:
      - ./load-tests:/scripts:ro
      - ./load-tests/results:/results
    depends_on:
      service:
        condition: service_healthy