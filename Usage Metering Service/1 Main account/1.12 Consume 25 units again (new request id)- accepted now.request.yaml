$kind: http-request
name: "1.12 Consume 25 units again (new request id): accepted now"
url: "{{baseUrl}}/consume"
method: POST
headers:
  X-API-Key: "{{apiKey}}"
  Content-Type: application/json
body:
  type: json
  content: '{"userId":"alice","requestId":"pm-{{runId}}-3","units":25}'
scripts:
  - type: afterResponse
    code: |-
      pm.test('200', function () { pm.response.to.have.status(200); });
      const j = pm.response.json();
      pm.test('accepted under Premium', function () { pm.expect(j.accepted).to.eql(true); });
      pm.test('alice and the account both have 9965 left (35 used)', function () { pm.expect(j.remaining.user.monthlyAllowance).to.eql(9965); pm.expect(j.remaining.account.monthlyAllowance).to.eql(9965); });
    language: text/javascript
order: 12000
