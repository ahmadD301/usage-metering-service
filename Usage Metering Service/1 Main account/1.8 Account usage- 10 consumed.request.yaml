$kind: http-request
name: "1.8 Account usage: 10 consumed"
url: "{{baseUrl}}/usage"
method: GET
headers:
  X-API-Key: "{{apiKey}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('200', function () { pm.response.to.have.status(200); });
      pm.test('the account used 10 units', function () { pm.expect(pm.response.json().account.consumed.month).to.eql(10); });
    language: text/javascript
order: 8000
