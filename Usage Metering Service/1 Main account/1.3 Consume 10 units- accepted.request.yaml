$kind: http-request
name: "1.3 Consume 10 units: accepted"
url: "{{baseUrl}}/consume"
method: POST
headers:
  X-API-Key: "{{apiKey}}"
  Content-Type: application/json
body:
  type: json
  content: '{"userId":"alice","requestId":"pm-{{runId}}-1","units":10}'
scripts:
  - type: afterResponse
    code: |-
      pm.test('200', function () { pm.response.to.have.status(200); });
      const j = pm.response.json();
      pm.test('accepted and not a replay', function () { pm.expect(j.accepted).to.eql(true); pm.expect(j.replayed).to.eql(false); });
      pm.test('alice has 990 left, the account 9990', function () { pm.expect(j.remaining.user.monthlyAllowance).to.eql(990); pm.expect(j.remaining.account.monthlyAllowance).to.eql(9990); });
    language: text/javascript
order: 3000
