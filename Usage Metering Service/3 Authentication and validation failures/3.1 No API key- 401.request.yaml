$kind: http-request
name: "3.1 No API key: 401"
url: "{{baseUrl}}/account"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('401', function () { pm.response.to.have.status(401); });
      pm.test('missing_api_key', function () { pm.expect(pm.response.json().error.code).to.eql('missing_api_key'); });
    language: text/javascript
order: 1000
