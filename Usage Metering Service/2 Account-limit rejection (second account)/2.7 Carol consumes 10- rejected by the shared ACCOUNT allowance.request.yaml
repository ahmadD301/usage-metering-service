$kind: http-request
name: "2.7 Carol consumes 10: rejected by the shared ACCOUNT allowance"
url: "{{baseUrl}}/consume"
method: POST
headers:
  X-API-Key: "{{apiKey2}}"
  Content-Type: application/json
body:
  type: json
  content: '{"userId":"carol","requestId":"pm-{{runId}}-5","units":10}'
scripts:
  - type: afterResponse
    code: |-
      pm.test('200', function () { pm.response.to.have.status(200); });
      const j = pm.response.json();
      pm.test('rejected', function () { pm.expect(j.accepted).to.eql(false); });
      pm.test('blocked at the account level: limit 25, used 20, 5 left', function () {
        const p = j.reason.primary;
        pm.expect(p.level).to.eql('account');
        pm.expect(p.rule).to.eql('monthly_allowance');
        pm.expect(p.limit).to.eql(25);
        pm.expect(p.used).to.eql(20);
        pm.expect(p.remaining).to.eql(5);
      });
      pm.test('carol herself still has her full allowance', function () { pm.expect(j.remaining.user.monthlyAllowance).to.eql(1000); });
    language: text/javascript
order: 7000
