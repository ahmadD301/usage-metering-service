$kind: http-request
url: "{{baseUrl}}/accounts"
method: POST
headers:
  X-Admin-Token: "{{adminToken}}"
  Content-Type: application/json
body:
  type: json
  content: '{"name":"Postman account 2 {{runId}}"}'
scripts:
  - type: afterResponse
    code: |-
      pm.test('201 Created', function () { pm.response.to.have.status(201); });
      pm.collectionVariables.set('apiKey2', pm.response.json().apiKey);
    language: text/javascript
order: 1000
