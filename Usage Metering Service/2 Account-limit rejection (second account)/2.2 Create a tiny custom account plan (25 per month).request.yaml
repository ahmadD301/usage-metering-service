$kind: http-request
url: "{{baseUrl}}/plans"
method: POST
headers:
  X-API-Key: "{{apiKey2}}"
  Content-Type: application/json
body:
  type: json
  content: '{"name":"Tiny account","scope":"account","rules":[{"kind":"monthly_allowance","limit":25},{"kind":"max_per_request","limit":100}]}'
scripts:
  - type: afterResponse
    code: |-
      pm.test('201 Created', function () { pm.response.to.have.status(201); });
      pm.collectionVariables.set('planId2', pm.response.json().plan.id);
    language: text/javascript
order: 2000
